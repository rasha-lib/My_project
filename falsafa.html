<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قسم الفلسفة</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background-image: url('خلفية.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      position: relative;
      padding-bottom: 120px;
    }

    /* زر القائمة */
    .menu-btn {
      position: fixed;
      top: 20px;
      right: 25px;
      width: 50px;
      height: 40px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      cursor: pointer;
      z-index: 1001;
    }

    .menu-btn span {
      display: block;
      height: 6px;
      width: 100%;
      background-color: #fff;
      border-radius: 3px;
      transition: all 0.3s ease;
    }

    /* القائمة الجانبية */
    .side-menu {
      height: 100%;
      width: 300px;
      position: fixed;
      top: 0;
      right: -300px;
      background-color: rgba(0,0,0,0.95);
      overflow-x: hidden;
      transition: 0.4s ease;
      padding-top: 60px;
      box-sizing: border-box;
      z-index: 1000;
    }

    .side-menu input {
      width: 80%;
      margin: 10px auto;
      display: block;
      padding: 10px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
    }

    .side-menu a {
      padding: 15px 30px;
      text-decoration: none;
      font-size: 22px;
      color: #ffd700;
      display: block;
      transition: background 0.3s;
    }

    .side-menu a:hover {
      background-color: rgba(128,0,0,0.7);
      border-radius: 6px;
    }

    .no-result {
      text-align: center;
      color: #ff6666;
      font-size: 20px;
      margin-top: 20px;
      display: none;
    }

    /* عنوان القسم */
    h1 {
      margin-top: 100px;
      font-size: 42px;
      color: gold;
      text-shadow: 2px 2px 10px rgba(0,0,0,0.7);
    }

    /* الكتب */
    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
      gap: 25px;
    }

    .book-card {
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 12px;
      width: 230px;
      text-align: center;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease;
      color: #222;
    }

    .book-card:hover {
      transform: scale(1.05);
    }

    .book-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }

    .book-card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #222;
    }

    .book-card a {
      display: inline-block;
      background-color: #0077cc;
      color: #fff;
      padding: 8px 15px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 10px;
      margin-right: 5px;
    }

    .book-card a:hover {
      background-color: #005fa3;
    }

    /* زر العودة */
    .btn-back {
      background-color: #800000;
      color: #fff;
      border: none;
      padding: 15px 30px;
      border-radius: 8px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.3s;
      text-decoration: none;
      display: block;
      text-align: center;
      margin: 40px auto;
    }

    .btn-back:hover {
      background-color: #a00000;
    }

    /* عدم وجود نتيجة */
    #notFound {
      display: none;
      text-align: center;
      color: red;
      font-size: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <!-- الثلاث شرطات -->
  <div class="menu-btn" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
  </div>

  <!-- 🔍 شريط البحث تحت العنوان -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب...">
  </div>

  <!-- القائمة الجانبية -->
  <div id="sideMenu" class="side-menu">
    <input id="menuSearch" type="text" placeholder="ابحث عن قسم...">
    <a href="adab.html">الآداب</a>
    <a href="falsafa.html">الفلسفة</a>
    <a href="fanon.html">الفنون</a>
    <a href="she3r.html">الشعر</a>
    <a href="tarikh.html">التاريخ</a>
    <a href="istiraha.html">استراحة القارئ</a>
    <a href="tech.html">تكنولوجيا</a>
    <div id="noResult" class="no-result">⚠ غير متوفر</div>
  </div>

  <!-- العنوان -->
  <h1>قسم الفلسفة</h1>

  <!-- الكتب -->
  <div class="container">
    <!-- الكتاب الأول -->
    <div class="book-card">
      <img src="10.jpg" alt="السؤال الاخر">
      <h3>السؤال الاخر</h3>
      <a href="السؤال_الآخر.pdf" target="_blank">📖 قراءة</a>
      <a href="pdfs/العقل_والثورة.pdf" download>⬇ تحميل</a>
    </div>

    <!-- الكتاب الثاني -->
    <div class="book-card">
      <img src="11.jpg" alt="المثقفون">
      <h3>المثقفون</h3>
      <a href="المثقفون.pdf" target="_blank">📖 قراءة</a>
      <a href="المثقفون.pdf" download>⬇ تحميل</a>
    </div>

    <!-- الكتاب الثالث -->
    <div class="book-card">
      <img src="12.jpg" alt="العقل والثورة">
      <h3>العقل والثورة</h3>
      <a href="العقل_والثورة.pdf" target="_blank">📖 قراءة</a>
      <a href="العقل_والثورة.pdf" download>⬇ تحميل</a>
    </div>
  </div>

  <div id="notFound">❌ الكتاب غير متوفر</div>

  <!-- زر العودة -->
  <a href="arabic.html" class="btn-back">⬅ العودة للصفحة العربية</a>

  <script>
    const sideMenu = document.getElementById('sideMenu');
    const menuBtn = document.querySelector('.menu-btn');
    const searchInput = document.getElementById('searchInput');
    const books = document.querySelectorAll('.book-card');
    const notFound = document.getElementById('notFound');
    const links = sideMenu.querySelectorAll('a');
    const noResult = document.getElementById('noResult');
    const menuSearch = document.getElementById('menuSearch');

    function toggleMenu() {
      if (sideMenu.style.right === '0px') {
        sideMenu.style.right = '-300px';
      } else {
        sideMenu.style.right = '0px';
      }
    }

    // البحث عن الكتب في الصفحة
    searchInput.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      let found = false;
      books.forEach(book => {
        const title = book.querySelector('h3').textContent.trim().toLowerCase();
        if (title.includes(query) || query === '') {
          book.style.display = 'block';
          found = true;
        } else {
          book.style.display = 'none';
        }
      });
      notFound.style.display = found || query === '' ? 'none' : 'block';
    });

    // البحث داخل القائمة الجانبية
    menuSearch.addEventListener('input', function() {
      const query = this.value.trim().toLowerCase();
      let foundMenu = false;

      links.forEach(link => {
        if (link.textContent.toLowerCase().includes(query) || query === '') {
          link.style.display = 'block';
          foundMenu = true;
        } else {
          link.style.display = 'none';
        }
      });

      noResult.style.display = foundMenu || query === '' ? 'none' : 'block';
    });

    // إغلاق القائمة عند الضغط خارجها
    document.addEventListener('click', function(event) {
      if (!sideMenu.contains(event.target) && !menuBtn.contains(event.target)) {
        sideMenu.style.right = '-300px';
      }
    });
  </script>

</body>
</html>
