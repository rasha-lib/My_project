<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>قسم الأدب</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background-image: url('خلفية.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center center;
      direction: rtl;
      color: #222;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 45px;
      font-weight: bold;
  color: white;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    /* زر الشرطات */
    .menu-btn {
      position: absolute;
      top: 25px;
      right: 70px;
      font-size: 35px;
      cursor: pointer;
      color: white;
      transition: transform 0.2s;
    }

    .menu-btn:hover {
      transform: scale(1.15);
    }

    /* القائمة الجانبية */
    .side-menu {
      height: 100%;
      width: 0;
  position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      background-color: rgba(0,0,0,0.9);
      overflow-x: hidden;
      transition: 0.4s;
      padding-top: 60px;
    }

    .side-menu a, .side-menu input {
      display: block;
      color: white;
      text-decoration: none;
      padding: 12px 25px;
      text-align: right;
      font-size: 18px;
    }

    .side-menu a:hover {
      background-color: rgba(255,255,255,0.1);
  }

    .side-menu input {
      width: 80%;
      margin: 10px auto;
      border: none;
      border-radius: 6px;
      padding: 8px;
      font-size: 16px;
      background-color: rgba(255,255,255,0.2);
      color: white;
  text-align: right;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 25px;
      font-size: 36px;
      cursor: pointer;
      color: white;
    }

    /* شريط البحث أعلى الصفحة */
    .search-bar {
      text-align: center;
      margin: 20px auto;
      width: 100%;
    }

    .search-bar input {
      width: 100%;
      padding: 30px;
      border: none;
      border-radius: 10px;
      font-size: 20px;
  background-color: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: right;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
      gap: 25px;
    }

    .book-card {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      width: 230px;
      text-align: center;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }
  .book-card:hover {
      transform: scale(1.05);
    }

    .book-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }

    .book-card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #222;
    }

    .book-card a {
      display: inline-block;
      background-color: #0077cc;
      color: #fff;
      padding: 8px 15px;
      border-radius: 6px;
  text-decoration: none;
      margin-top: 10px;
    }

    .book-card a:hover {
      background-color: #005fa3;
    }

    #notFound {
      display: none;
      text-align: center;
      color: red;
      font-size: 20px;
      margin-top: 20px;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 40px auto;
      background-color: #800000;
      color: #fff;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
  font-size: 20px;
    }

    .back-btn:hover {
      background-color: #005fa3;
    }
  </style>
</head>
<body>

  <header>
    قسم الأدب
    <span class="menu-btn" onclick="openMenu()">☰</span>
  </header>

  <!-- القائمة الجانبية -->
  <div id="sideMenu" class="side-menu">
    <span class="close-btn" onclick="closeMenu()">×</span>
    <input type="text" placeholder="ابحث عن كتاب...">
    <a href="adab.html">الآداب</a>
    <a href="falsafa.html">الفلسفة</a>
    <a href="fanon.html">الفنون</a>
    <a href="she3r.html">الشعر</a>
    <a href="tarikh.html">التاريخ</a>
    <a href="istiraha.html">استراحة القارئ</a>
    <a href="tech.html">تكنولوجيا</a>
  </div>
<!-- شريط البحث -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب...">
  </div>

  <div id="notFound">❌ الكتاب غير متوفر</div>

  <div class="container" id="booksContainer">
    <div class="book-card">
      <img src="غلاف.jpg" alt="غلاف الكتاب">
      <h3>الإعداد والانتحال</h3>
      <a href="الإعداد_والانتحال.pdf" target="_blank">📖 قراءة</a>
    </div>

    <div class="book-card">
      <img src="غلاف 3.jpg" alt="غلاف حب الحياة">
      <h3>حُب الحياة</h3>
      <a href="حُب_الحياة.pdf" target="_blank">📖 قراءة</a>
    </div>

    <div class="book-card">
      <img src="غلاف2.jpg" alt="غلاف فن الأدب">
      <h3>فن الأدب</h3>
<a href="فن_الأدب.pdf" target="_blank">📖 قراءة</a>
    </div>
  </div>

  <a href="arabic.html" class="back-btn"> العودة للصفحة العربية</a>

  <script>
    // فتح القائمة الجانبية
    function openMenu() {
      document.getElementById("sideMenu").style.width = "250px";
    }

    // إغلاق القائمة الجانبية
    function closeMenu() {
      document.getElementById("sideMenu").style.width = "0";
    }

    // البحث عن الكتب
  const searchInput = document.getElementById('searchInput');
    const books = document.querySelectorAll('.book-card');
    const notFound = document.getElementById('notFound');

    searchInput.addEventListener('input', function() {
      const query = this.value.trim();
      let found = false;
      books.forEach(book => {
        if (book.querySelector('h3').textContent.includes(query) || query === '') {
          book.style.display = 'block';
        } else {
          book.style.display = 'none';
        }
        if (book.querySelector('h3').textContent.includes(query)) {
          found = true;
        }
      });
      notFound.style.display = (query && !found) ? 'block' : 'none';
    });
  </script>
</body>
</html>
