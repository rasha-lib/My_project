<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>Tareekh.html</title>
  <style>
    body {
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background-image: url('خلفية.jpg');
      background-size: cover;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-position: center center;
      direction: rtl;
      color: #222;
    }

    header {
      text-align: center;
      padding: 20px;
      font-size: 45px;
      font-weight: bold;
      color: white;
      position: relative;
      box-shadow: 0 2px 8px rgba(0,0,0,0.2);
    }

    .menu-btn {
      position: absolute;
      top: 25px;
      right: 25px;
      font-size: 70px;
      cursor: pointer;
      color: white;
      transition: transform 0.2s;
      z-index: 20;
    }

    .menu-btn:hover {
      transform: scale(1.15);
    }

    .side-menu {
      height: 100%;
      width: 0;
      position: fixed;
      z-index: 10;
      top: 0;
      right: 0;
      background-color: rgba(0,0,0,0.95);
      overflow-x: hidden;
      transition: 0.4s;
      padding-top: 120px;
    }

    .side-menu a {
      display: block;
      color: gold;
      text-decoration: none;
      padding: 12px 25px;
      text-align: right;
      font-size: 18px;
    }

    .side-menu a:hover {
      background-color: rgba(255,255,255,0.1);
    }

    .search-bar {
      width: 100%;
      margin: 0;
    }

    .search-bar input {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 0;
      font-size: 20px;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      text-align: right;
      box-sizing: border-box;
      outline: none;
    }

    .container {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      padding: 30px;
      gap: 25px;
    }

    .book-card {
      background-color: rgba(255, 255, 255, 0.95);
      border-radius: 12px;
      width: 230px;
      text-align: center;
      padding: 15px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.2);
      transition: transform 0.2s ease;
    }

    .book-card:hover {
      transform: scale(1.05);
    }

    .book-card img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      border-radius: 10px;
    }

    .book-card h3 {
      margin: 10px 0 5px;
      font-size: 18px;
      color: #222;
    }

    .book-card a {
      display: inline-block;
      background-color: #0077cc;
      color: #fff;
      padding: 8px 15px;
      border-radius: 6px;
      text-decoration: none;
      margin-top: 10px;
    }

    .book-card a:hover {
      background-color: #005fa3;
    }

    #notFound {
      display: none;
      text-align: center;
      color: red;
      font-size: 20px;
      margin-top: 20px;
    }

    .back-btn {
      display: block;
      width: fit-content;
      margin: 40px auto;
      background-color: #a30000;
      color: #fff;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
      font-size: 20px;
      transition: background-color 0.3s;
    }

    .back-btn:hover {
      background-color: #cc0000;
    }
  </style>
</head>
<body>

  <header>
    Tareekh.html
    <span class="menu-btn" onclick="openMenu()">☰</span>
  </header>

  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="ابحث عن كتاب...">
  </div>

  <div id="sideMenu" class="side-menu">
    <a href="adab.html">Adab.html</a>
    <a href="falsafa.html">Falsafa.html</a>
    <a href="funoon.html">Funoon.html</a>
    <a href="Shi‘r.html">Shi‘r.html</a>
    <a href="Tareekh.html">Tareekh.html</a>
    <a href="istiraha.html">Istiraha.html</a>
    <a href="tech.html">Tech.html</a>
  </div>

  <div id="notFound">❌ الكتاب غير متوفر</div>

  <div class="container">
    <!-- الكتاب الأول -->
    <div class="book-card">
      <img src="غلاف.jpg" alt="غلاف الإعداد والانتحال">
      <h3>الإعداد والانتحال</h3>
      <a href="الإعداد_والانتحال.pdf" target="_blank">📖 قراءة</a>
    </div>
  </div>

  <a href="arabic.html" class="back-btn">العودة للصفحة العربية</a>

  <script>
    const sideMenu = document.getElementById("sideMenu");

    function openMenu() {
      sideMenu.style.width = "250px";
      document.addEventListener('click', closeOnOutsideClick);
    }

    function closeMenu() {
      sideMenu.style.width = "0";
      document.removeEventListener('click', closeOnOutsideClick);
    }

    function closeOnOutsideClick(e) {
      if (!sideMenu.contains(e.target) && !e.target.classList.contains('menu-btn')) {
        closeMenu();
      }
    }

    const searchInput = document.getElementById('searchInput');
    const books = document.querySelectorAll('.book-card');
    const notFound = document.getElementById('notFound');

    searchInput.addEventListener('input', function() {
      const query = this.value.trim();
      let found = false;
      books.forEach(book => {
        const title = book.querySelector('h3').textContent.trim();
        if (title.includes(query) || query === '') {
          book.style.display = 'block';
        } else {
          book.style.display = 'none';
        }
        if (title.includes(query)) {
          found = true;
        }
      });
      notFound.style.display = (query && !found) ? 'block' : 'none';
    });
  </script>

</body>
</html>
